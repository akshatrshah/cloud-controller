apiVersion: v1
kind: Namespace
metadata:
  name: orbitcp
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orbitcp
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: orbitcp
type: Opaque
stringData:
  POSTGRES_PASSWORD: orbitcp-demo-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orbitcp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orbitcp
            - name: POSTGRES_USER
              value: orbitcp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Every committed write is an INSERT on each of the 5 nodes'
          # logs, so Postgres needs real CPU under 500 concurrent clients.
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orbitcp"]
            initialDelaySeconds: 3
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Headless service: stable per-pod DNS names (raft-0.raft-headless, ...)
# that peers use to reach each other. Raft RPCs and the client API share
# port 8080 (Raft is plain HTTP+JSON, see transport.go).
apiVersion: v1
kind: Service
metadata:
  name: raft-headless
  namespace: orbitcp
  labels:
    app: orbitcp
spec:
  clusterIP: None
  # Publish each pod's DNS record as soon as it has an IP, not only once
  # it passes readiness. A restarted node must hear the leader's
  # heartbeats within one election timeout (300-600ms); waiting for a
  # readiness probe first would make it time out and start a needless
  # pre-vote round instead of rejoining quietly.
  publishNotReadyAddresses: true
  selector:
    app: orbitcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orbitcp
  namespace: orbitcp
  labels:
    app: orbitcp
spec:
  type: ClusterIP
  selector:
    app: orbitcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbitcp-pdb
  namespace: orbitcp
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: orbitcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  namespace: orbitcp
spec:
  serviceName: raft-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: orbitcp
  template:
    metadata:
      labels:
        app: orbitcp
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                    matchLabels:
                      app: orbitcp
                topologyKey: kubernetes.io/hostname
      containers:
        - name: orbitcp
          image: orbitcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "8080"
            - name: CLUSTER
              value: >-
                raft-0.raft-headless:8080,raft-1.raft-headless:8080,raft-2.raft-headless:8080,raft-3.raft-headless:8080,raft-4.raft-headless:8080
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PG_DSN
              value: "postgres://orbitcp:$(POSTGRES_PASSWORD)@postgres:5432/orbitcp?sslmode=disable"
          # A low CPU limit makes the kernel throttle the pod in 100ms
          # windows. A throttled leader can't send its 75ms heartbeats,
          # followers time out, and you get elections with no real
          # failure. The limit has to leave headroom for load spikes.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
