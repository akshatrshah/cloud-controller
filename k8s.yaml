apiVersion: v1
kind: Namespace
metadata:
  name: orbitcp
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orbitcp
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: orbitcp
type: Opaque
stringData:
  POSTGRES_PASSWORD: orbitcp-demo-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orbitcp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orbitcp
            - name: POSTGRES_USER
              value: orbitcp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orbitcp"]
            initialDelaySeconds: 3
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Headless service: stable peer DNS. Exposes BOTH the HTTP API port and
# hashicorp/raft's own TCP consensus transport (a separate binary
# protocol, not HTTP -- it can't share port 8080).
apiVersion: v1
kind: Service
metadata:
  name: raft-headless
  namespace: orbitcp
  labels:
    app: orbitcp
spec:
  clusterIP: None
  # REQUIRED for a StatefulSet's peer-discovery headless service: without
  # this, Kubernetes only publishes a pod's DNS record once it's already
  # Ready. But every raft node resolves its OWN hostname just to bind its
  # transport listener -- which has to happen BEFORE it can ever pass its
  # readiness check. Omitting this creates an actual deadlock (not ready
  # -> no DNS record -> can't start listening -> never ready), which
  # surfaced as a pod consistently failing to resolve its own name across
  # dozens of restarts rather than a one-off timing fluke.
  publishNotReadyAddresses: true
  selector:
    app: orbitcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: raft-transport
      port: 18080
      targetPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: orbitcp
  namespace: orbitcp
  labels:
    app: orbitcp
spec:
  type: ClusterIP
  selector:
    app: orbitcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbitcp-pdb
  namespace: orbitcp
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: orbitcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  namespace: orbitcp
spec:
  serviceName: raft-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: orbitcp
  template:
    metadata:
      labels:
        app: orbitcp
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                    matchLabels:
                      app: orbitcp
                topologyKey: kubernetes.io/hostname
      containers:
        - name: orbitcp
          image: orbitcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 18080
              name: raft-transport
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "8080"
            - name: CLUSTER
              value: >-
                raft-0.raft-headless:8080,raft-1.raft-headless:8080,raft-2.raft-headless:8080,raft-3.raft-headless:8080,raft-4.raft-headless:8080
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PG_DSN
              value: "postgres://orbitcp:$(POSTGRES_PASSWORD)@postgres:5432/orbitcp?sslmode=disable"
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
